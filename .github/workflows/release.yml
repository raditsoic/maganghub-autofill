name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".claude-plugin/**"
      - ".omp-plugin/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest versions in sync
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
          else
            scripts/check-versions.sh
          fi

  publish:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} /^\[.*\]: /{f=0} f' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "no CHANGELOG section for $v" >&2; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
